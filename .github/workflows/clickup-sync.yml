# Generated by engineering-ruleset-plugin. Re-run the sync to update it;
# local edits are overwritten.
name: ClickUp task sync

on:
  pull_request:
    types: [closed]
    branches: [dev, test, prod]
  # Manual entry, for verifying the wiring (secret, id extraction, environment
  # mapping, ClickUp auth) without a PR. It is ALWAYS read-only: only a real
  # merged pull request may move a task, so a dispatch reports what would happen
  # and stops. Without that, anyone able to run a workflow could advance a card
  # that no one had merged.
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch to check, e.g. feature/WOH-123/thing"
        required: true
        type: string
      base_ref:
        description: "Environment branch to check against, e.g. dev"
        required: true
        type: string

permissions:
  contents: read

jobs:
  advance-task:
    # Closing a PR without merging must not touch the task.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Advance the linked ClickUp task
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          # Only needed when the workspace uses ClickUp Custom Task IDs.
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
          # A dispatch is always a rehearsal; only a merged PR writes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ -z "${CLICKUP_TOKEN:-}" ]; then
            echo "::warning::CLICKUP_TOKEN is not set; skipping ClickUp sync."
            exit 0
          fi

          # The branch merged INTO selects the status. This case block is the
          # entire environment mapping.
          base="${BASE_REF#refs/heads/}"
          case "$base" in
            'dev') want='in progress' ;;
            'test') want='QA' ;;
            'prod') want='complete' ;;
            *)
              echo "::warning::No ClickUp status is mapped for '$base'; nothing to sync."
              exit 0
              ;;
          esac

          # Branches are <prefix>/WOH-<id>[/description], enforced by the
          # branch-nomenclature ruleset.
          id="$(printf '%s' "$HEAD_REF" | awk -F/ -v p='WOH-' \
            'index($2, p) == 1 { s = substr($2, length(p) + 1); if (match(s, /^[A-Za-z0-9]+/)) print substr(s, 1, RLENGTH) }')"

          if [ -z "$id" ]; then
            echo "::warning::No WOH- task id in '$HEAD_REF'; nothing to sync."
            exit 0
          fi

          query=""
          if [ -n "${CLICKUP_TEAM_ID:-}" ]; then
            query="?custom_task_ids=true&team_id=${CLICKUP_TEAM_ID}"
          fi
          url="https://api.clickup.com/api/v2/task/${id}${query}"

          task="$(curl -sS -f -H "Authorization: $CLICKUP_TOKEN" "$url")"
          status="$(printf '%s' "$task" | jq -r '.status.status // empty')"
          list_id="$(printf '%s' "$task" | jq -r '.list.id // empty')"
          echo "Task $id is '${status:-unknown}'; '$base' targets '$want'."

          # ClickUp has no endpoint that creates a status, so the column has to
          # exist already. Resolve case-insensitively and report precisely.
          available="$(curl -sS -f -H "Authorization: $CLICKUP_TOKEN" \
            "https://api.clickup.com/api/v2/list/${list_id}" | jq -r '.statuses[].status')"

          resolved="$(printf '%s\n' "$available" \
            | awk -v w="$(printf '%s' "$want" | tr '[:upper:]' '[:lower:]')" \
              'tolower($0) == w { print; exit }')"

          if [ -z "$resolved" ]; then
            echo "::error::ClickUp list $list_id has no '$want' status. The API cannot create one — add it in ClickUp (List → Statuses), then re-run."
            echo "Available statuses:"
            printf '%s\n' "$available" | sed 's/^/  - /'
            exit 1
          fi

          # Forward-only: a late merge into an earlier environment must never
          # drag a task backwards along the pipeline.
          rank() {
            printf '%s\n' 'to do' 'todo' 'open' 'backlog' 'pending' 'in progress' 'QA' 'Staging' 'UAT' 'Pre-prod' 'Done' 'complete' \
              | awk -v s="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" \
                'tolower($0) == s { print NR; exit }'
          }

          from="$(rank "$status")"
          to="$(rank "$resolved")"

          if [ -z "$to" ]; then
            echo "::warning::'$resolved' is not in the configured pipeline; leaving task $id alone."
            exit 0
          fi
          if [ -z "$from" ]; then
            echo "Task $id is '$status', which is not in the pipeline; leaving it alone."
            exit 0
          fi
          if [ "$to" -le "$from" ]; then
            echo "Task $id is already at or past '$resolved'; leaving it alone."
            exit 0
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "[dry-run] would move task $id from '$status' to '$resolved'."
            exit 0
          fi

          curl -sS -f -X PUT \
            -H "Authorization: $CLICKUP_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg s "$resolved" '{status: $s}')" \
            "$url" > /dev/null

          echo "Task $id moved to '$resolved'."
