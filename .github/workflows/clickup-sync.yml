# Generated by engineering-ruleset-plugin. Re-run the sync to update it;
# local edits are overwritten.
name: ClickUp task sync

on:
  pull_request:
    types: [closed]
    branches: [dev]
  # Manual test entry: simulates a merged branch without needing a real PR,
  # so the wiring (secret, id extraction, ClickUp auth) can be verified alone.
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch name to simulate, e.g. feature/CU-123/thing"
        required: true
        type: string

permissions:
  contents: read

jobs:
  advance-task:
    # Closing a PR without merging must not touch the task.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Advance the linked ClickUp task
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          # Only needed when the workspace uses ClickUp Custom Task IDs.
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
        run: |
          set -euo pipefail

          if [ -z "${CLICKUP_TOKEN:-}" ]; then
            echo "::warning::CLICKUP_TOKEN is not set; skipping ClickUp sync."
            exit 0
          fi

          # Branches are <prefix>/CU-<id>[/description], enforced by the
          # branch-nomenclature ruleset.
          id="$(printf '%s' "$HEAD_REF" | awk -F/ -v p='CU-' \
            'index($2, p) == 1 { print substr($2, length(p) + 1) }')"

          if [ -z "$id" ]; then
            echo "::warning::No CU- task id in '$HEAD_REF'; nothing to sync."
            exit 0
          fi

          query=""
          if [ -n "${CLICKUP_TEAM_ID:-}" ]; then
            query="?custom_task_ids=true&team_id=${CLICKUP_TEAM_ID}"
          fi
          url="https://api.clickup.com/api/v2/task/${id}${query}"

          status="$(curl -sS -f -H "Authorization: $CLICKUP_TOKEN" "$url" \
            | jq -r '.status.status // empty')"
          echo "Task $id is currently '${status:-unknown}'."

          lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
          case "$lower" in
            'to do'|'todo'|'open'|'backlog'|'pending')
              ;;
            *)
              echo "Not a to-do status; leaving task $id untouched."
              exit 0
              ;;
          esac

          curl -sS -f -X PUT \
            -H "Authorization: $CLICKUP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"in progress"}' \
            "$url" > /dev/null

          echo "Task $id moved to 'in progress'."
