# TEMPORARY — demo tooling only, remove after the pipeline walkthrough.
# Lets the maintainer probe ClickUp state and seed a demo task using the
# repository's CLICKUP_TOKEN secret, so the token never leaves GitHub Actions.
# Read endpoints plus a single create-task write; it never changes statuses.
name: ClickUp admin (temporary)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [probe, create-task]
      task_id:
        description: "probe: an existing task id used to locate the list"
        required: false
        type: string
      list_id:
        description: "create-task: the list to create the task in"
        required: false
        type: string
      task_name:
        description: "create-task: task title"
        required: false
        type: string
      task_desc:
        description: "create-task: task description (markdown)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Run ClickUp admin action
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          ACTION: ${{ inputs.action }}
          TASK_ID: ${{ inputs.task_id }}
          LIST_ID: ${{ inputs.list_id }}
          TASK_NAME: ${{ inputs.task_name }}
          TASK_DESC: ${{ inputs.task_desc }}
        run: |
          set -euo pipefail
          if [ -z "${CLICKUP_TOKEN:-}" ]; then
            echo "::error::CLICKUP_TOKEN is not set."
            exit 1
          fi

          api() { curl -sS -f -H "Authorization: $CLICKUP_TOKEN" "$@"; }

          case "$ACTION" in
            probe)
              echo "== task =="
              task="$(api "https://api.clickup.com/api/v2/task/${TASK_ID}")"
              printf '%s' "$task" | jq '{id, name, status: .status.status, url,
                list: {id: .list.id, name: .list.name},
                folder: .folder.name, space: .space.id}'
              list_id="$(printf '%s' "$task" | jq -r '.list.id')"
              echo "== list statuses =="
              api "https://api.clickup.com/api/v2/list/${list_id}" \
                | jq '{id, name, statuses: [.statuses[] | {status, type, orderindex}]}'
              ;;
            create-task)
              echo "== created task =="
              api -X POST -H "Content-Type: application/json" \
                -d "$(jq -nc --arg n "$TASK_NAME" --arg d "$TASK_DESC" \
                      '{name: $n, markdown_description: $d}')" \
                "https://api.clickup.com/api/v2/list/${LIST_ID}/task" \
                | jq '{id, name, status: .status.status, url}'
              ;;
            *)
              echo "::error::Unknown action '$ACTION'"; exit 1 ;;
          esac
